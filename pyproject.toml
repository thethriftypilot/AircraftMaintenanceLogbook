[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "thrifty-pilot-aircraft-maintenance"
version = "1.1.0rc1"
requires-python = ">=3.13,<3.14"
dependencies = ["PySide6==6.10.1", "reportlab==4.4.5"]

[tool.setuptools]
packages = ["logbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
