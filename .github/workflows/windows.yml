name: Windows build and verification
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
          architecture: x64
      - run: python -m venv .venv
      - run: .venv/Scripts/python.exe -m pip install -r requirements-lock.txt
      - name: Ensure installer compiler
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Installer compiler checksum mismatch' }
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Installer compiler setup failed' }
      - run: ./scripts/build.ps1
      - run: .venv/Scripts/python.exe scripts/source_archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-1.1.0-rc1
          path: |
            dist/release/*
            docs/test-results.xml
            build/packaged-smoke-rc1/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: docs/test-results.xml
